name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          find bin lib/setup lib/services lib/utils lib/plugins \
            -type f ! -name "*.md" ! -name "*.json" ! -name "*.yaml" ! -name "*.yml" ! -name "priority" \
            | xargs -I{} bash -n {}

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: .
          additional_files: bin lib/setup lib/services lib/utils lib/plugins
        env:
          SHELLCHECK_OPTS: -x
