name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          find bin lib/setup lib/services lib/utils lib/plugins \
            -type f ! -name "*.md" ! -name "*.json" ! -name "*.yaml" ! -name "*.yml" ! -name "priority" \
            | xargs shellcheck --severity=warning
