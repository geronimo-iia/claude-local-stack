model_list:
  # Haiku-tier → Anthropic direct (Claude Max)
  - model_name: "claude-haiku*"
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # Sonnet-tier → Anthropic direct (Claude Max)
  - model_name: "claude-sonnet*"
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Opus-tier → Sonnet (Opus not included in Max plan)
  - model_name: "claude-opus*"
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Catch-all → Anthropic direct
  - model_name: "*"
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
  callbacks: ["strip_thinking.proxy_handler_instance"]
  request_timeout: 600
  telemetry: false
